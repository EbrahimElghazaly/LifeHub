<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <h1 class="h3 fw-bold text-primary">LifeHub</h1>
      <p class="text-muted">✨ مرحباً بعودتك</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="model.email"
          name="email"
          required
          placeholder="example@email.com"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">كلمة المرور</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="model.password"
          name="password"
          required
          placeholder="••••••••"
        />
      </div>

      <div class="d-flex justify-content-between mb-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="remember" />
          <label class="form-check-label" for="remember">تذكرني</label>
        </div>
        <a href="#" class="text-secondary text-decoration-none small">نسيت كلمة المرور؟</a>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 py-2 mb-3"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'جاري التحميل...' : 'تسجيل الدخول' }}
      </button>

      <div *ngIf="error" class="alert alert-danger text-center small">
        {{ error }}
      </div>

      <p class="text-center text-muted mb-0">
        ليس لديك حساب؟ <a routerLink="/register" class="text-primary fw-bold text-decoration-none">سجل الآن</a>
      </p>
    </form>
  </div>
</div>

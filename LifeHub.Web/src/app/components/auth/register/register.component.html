<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <h1 class="h3 fw-bold text-primary">LifeHub</h1>
      <p class="text-muted">✨ إنشاء حساب جديد</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="mb-3">
        <label class="form-label">الاسم الكامل</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.fullName"
          name="fullName"
          required
          placeholder="أحمد محمد"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="model.email"
          name="email"
          required
          placeholder="example@email.com"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">كلمة المرور</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="model.password"
          name="password"
          required
          placeholder="••••••••"
          minlength="6"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">تأكيد كلمة المرور</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="model.confirmPassword"
          name="confirmPassword"
          required
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 py-2 mb-3"
        [disabled]="loading || registerForm.invalid"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'جاري التحميل...' : 'إنشاء الحساب' }}
      </button>

      <div *ngIf="error" class="alert alert-danger text-center small">
        {{ error }}
      </div>

      <div *ngIf="success" class="alert alert-success text-center small">
        {{ success }}
      </div>

      <p class="text-center text-muted mb-0">
        لديك حساب؟ <a routerLink="/login" class="text-primary fw-bold text-decoration-none">سجل دخول</a>
      </p>
    </form>
  </div>
</div>
